<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        .container{
            display: flex;
            max-width: 900px;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        .container img{
            width: 100%;
        }

        @media screen and (max-width: 576px) {
            .container{
            display: flex;
            flex-direction: column-reverse;
            max-width: 100%;
            }
        }
    
    </style>
</head>
<body>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <div class="container">
        <div class="">
            <img src="images/veg.webp" alt="">
        </div>
        <div class=""><img src="images/bike.jpg" alt=""></div>
    </div>
</body>
</html>
