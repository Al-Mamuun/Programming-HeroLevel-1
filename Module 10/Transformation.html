<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation</title>
    <style>
        .container{
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
        }
        .Item,.inner{
            width: 250px;
            height: 250px;
            border: 1px solid black;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        .inner{
            background-color: teal;
            transform: scale(0.5)rotate(45deg)translateX(30px);
        }
        .Item{
            background-color: tomato;
        }

        .Item:hover .inner{
            transform: scale(1)rotate(0deg)translateX(0px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="Item">
        <div class="inner">Inner-1</div>
    </div>
    <div class="Item">
        <div class="inner">Inner-2</div>
    </div>
    <div class="Item">
        <div class="inner">Inner-3</div>
    </div>
    </div>
</body>
</html>
