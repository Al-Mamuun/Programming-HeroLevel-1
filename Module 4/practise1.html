<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practise 1</title>
    <link rel="stylesheet" href="Styles/practise1.css" />
</head>
<body>
    <main>
        <section class="container">
            <div class="card">
                <h2>Kung Fu Search</h2>
                <p>Search your Image here: <input type="text" placeholder="Enter your Kung Fu"><button style="margin-left: 2px;">Search</button></p>
                <br>
                <img src="media/camera.jpg" alt="Camera"><br>
                <a href="http://www.google.com" target="_blank">For more click here</a>
            </div>
        </section>
        <section>
           
            <form action="">
                <p>Feedback Form:</p>
                <label for="name">Name:</label><br>
                <input type="text"><br>
                <label for="date">Date:</label><br>
                <input type="date" name="" id=""><br>
                <label for="com">Comment:</label><br>
                <textarea name="com" id="" cols="30" rows="3" placeholder="Enter your Text"></textarea><br>
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>
</html>
