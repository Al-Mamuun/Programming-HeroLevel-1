<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Manager</title>
</head>
<body>
    <main>
        <article>
            <section>
                <div>
                    <h1>Audio 1</h1>
                    <audio controls="true" src="media/audio1.mp3"></audio>
                </div>
                <div>
                    <h1>Video 1</h1>
                    <video controls="true" src="media/video1.mp4" style="height: 300px; width: 400px;"></video>
                </div>
                <div>
                    <h2>YouTube Video Embeed</h2>
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/R3dUOk-GWNs?si=Byxp4LCaOHSDifRq" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </section>
        </article>
    </main>
</body>
</html>
