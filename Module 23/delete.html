<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="hmm">Delete Document</h1>
    <input id="text-btn" type="text" placeholder="Write Delete" />
    <button id="btn-dlt" disabled>Delete</button>

    <script>
      document.getElementById('text-btn')
      .addEventListener('keyup',function(event){
        const text = event.target.value;
        const btn = document.getElementById('btn-dlt');
        if(text === 'Delete'){
          btn.removeAttribute('disabled');
          const h1 = document.getElementById('hmm');
          h1.style.display = 'none';
        } else {
          btn.setAttribute('disabled',true);
        }
      });
    </script>
  </body>
</html>
