<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      .container {
        display: grid;
        gap: 3px;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(6, 150px);
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .item {
        grid-column: span 6;
        grid-row: span 2;
      }

      .item1,
      .item2,
      .item5,
      .item7 {
        grid-column: span 2;
        grid-row: span 2;
      }

      .item3,
      .item4 {
        grid-column: span 2;
        grid-row: span 1;
      }

      .item6 {
        grid-column: span 1;
        grid-row: span 1;
      }

      @media screen and (max-width: 576px) {
        .container {
          /* display: block; */
          display: grid;
          gap: 3px;
          grid-template-columns: repeat(2, 1fr);
        }

        .item,.item1,.item2,.item3,.item4,.item5,.item6,.item7 {
          grid-column: span 1;
          grid-row: span 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item"><img src="images/A.jpg" alt="" /></div>
      <div class="item1"><img src="images/B.jpg" alt="" /></div>
      <div class="item2"><img src="images/C.jpg" alt="" /></div>
      <div class="item3"><img src="images/D.jpg" alt="" /></div>
      <div class="item4"><img src="images/E.jpg" alt="" /></div>
      <div class="item5"><img src="images/F.jpg" alt="" /></div>
      <div class="item6"><img src="images/G.jpg" alt="" /></div>
      <div class="item6"><img src="images/G.jpg" alt="" /></div>
      <div class="item7"><img src="images/I.jpg" alt="" /></div>
      <div class="item6"><img src="images/G.jpg" alt="" /></div>
      <div class="item6"><img src="images/G.jpg" alt="" /></div>
    </div>
  </body>
</html>
