<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 200px) 50px 50px;
      }

      .box {
        background-color: rgba(146, 150, 150, 0.479);
        padding: 20px;
        font-size: 20px;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        border-radius: 10px;
      }

      .box1 {
        background-color: rgba(201, 14, 61, 0.479);
        padding: 20px;
        font-size: 20px;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        border-radius: 10px;
      }

      #first {
        grid-row: span 5;
      }

      #eleventh,
      #twelfth {
        grid-column: span 3;
      }

      @media screen and (max-width: 576px) {
        .container {
          grid-template-columns: 2fr;
          grid-template-rows: auto;
          gap: 10px;
        }

        #first {
          grid-row: span 1;
        }

        #eleventh,
        #twelfth {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="first" class="box">box - 1</div>
      <div class="box">box - 2</div>
      <div class="box">box - 3</div>
      <div class="box">box - 4</div>
      <div class="box">box - 5</div>
      <div class="box1">box - 6</div>
      <div class="box1">box - 7</div>
      <div class="box">box - 8</div>
      <div class="box1">box - 9</div>
      <div class="box1">box - 10</div>
      <div id="eleventh" class="box">box - 11</div>
      <div id="twelfth" class="box">box - 12</div>
    </div>
  </body>
</html>
